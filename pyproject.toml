[project]
name = "surface-defect-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Behrooz Azadi", email = "behrooz.azadi82@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
surface-defect-detection = "surface_defect_detection:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
